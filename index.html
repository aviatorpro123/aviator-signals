<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Sports Interface</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(135deg,#0f172a,#111827,#1e293b);
    color:white;
    position:relative;
}

/* Effet lumineux dynamique */
.bg-glow{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:rgba(59,130,246,0.12);
    filter:blur(90px);
    animation:moveGlow 8s infinite alternate ease-in-out;
}

@keyframes moveGlow{
    from{
        transform:translate(-120px,-80px);
    }
    to{
        transform:translate(120px,80px);
    }
}

/* Petits motifs sportifs */
.pattern{
    position:absolute;
    inset:0;
    background-image:
    radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size:28px 28px;
    opacity:0.35;
}

/* Carte principale */
.container{
    width:90%;
    max-width:420px;
    padding:35px 25px;
    border-radius:28px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.08);
    text-align:center;
    z-index:2;
    box-shadow:0 0 40px rgba(0,0,0,0.35);
}

/* Badge */
.badge{
    display:inline-block;
    padding:8px 18px;
    border-radius:999px;
    background:rgba(59,130,246,0.15);
    border:1px solid rgba(59,130,246,0.35);
    color:#93c5fd;
    font-size:14px;
    margin-bottom:20px;
}

/* Titre */
h1{
    font-size:32px;
    margin-bottom:12px;
    font-weight:700;
}

/* Texte */
.description{
    font-size:15px;
    line-height:1.7;
    color:#d1d5db;
    margin-bottom:30px;
}

/* Stats dynamiques */
.stats{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:28px;
    flex-wrap:wrap;
}

.stat-box{
    background:rgba(255,255,255,0.05);
    padding:12px 18px;
    border-radius:18px;
    min-width:100px;
    border:1px solid rgba(255,255,255,0.06);
}

.stat-number{
    font-size:20px;
    font-weight:bold;
    color:#60a5fa;
}

.stat-label{
    font-size:12px;
    color:#9ca3af;
    margin-top:4px;
}

/* Bouton principal centré */
.main-button{
    display:flex;
    justify-content:center;
    align-items:center;
    width:100%;
    padding:18px;
    border-radius:20px;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    color:white;
    background:
    linear-gradient(135deg,#2563eb,#1d4ed8);
    box-shadow:
    0 0 25px rgba(37,99,235,0.45);
    transition:0.3s ease;
    animation:pulse 2s infinite;
}

.main-button:hover{
    transform:scale(1.03);
}

@keyframes pulse{
    0%{
        box-shadow:0 0 10px rgba(37,99,235,0.35);
    }
    50%{
        box-shadow:0 0 28px rgba(37,99,235,0.6);
    }
    100%{
        box-shadow:0 0 10px rgba(37,99,235,0.35);
    }
}

/* Petit texte */
.footer{
    margin-top:22px;
    font-size:12px;
    color:#9ca3af;
}
</style>
</head>

<body>

<div class="bg-glow"></div>
<div class="pattern"></div>

<div class="container">

    <div class="badge">
        ⚽ Sports Interface
    </div>

    <h1>Sport Center</h1>

    <p class="description">
        Accédez à une interface moderne regroupant statistiques,
        tendances sportives et outils interactifs en temps réel.
    </p>

    <div class="stats">

        <div class="stat-box">
            <div class="stat-number" id="users">80K+</div>
            <div class="stat-label">Utilisateurs</div>
        </div>

        <div class="stat-box">
            <div class="stat-number" id="live">LIVE</div>
            <div class="stat-label">Statut</div>
        </div>

        <div class="stat-box">
            <div class="stat-number">24/7</div>
            <div class="stat-label">Accès</div>
        </div>

    </div>

    <!-- REMPLACE TON LIEN ICI -->
    <a class="main-button" href="https://t.me/+xfsLMoAitc1lNThk" target="_blank">
        🚀 Accéder au canal
    </a>

    <div class="footer">
        Interface optimisée mobile • Mise à jour dynamique
    </div>

</div>

<script>

/* Effet dynamique sur le nombre d'utilisateurs */

const users = document.getElementById("users");

let value = 12000;

setInterval(() => {

    value += Math.floor(Math.random() * 5);

    users.innerText = (value / 1000).toFixed(1) + "K+";

}, 2500);

</script>

</body>
</html>
